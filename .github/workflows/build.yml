name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Locate project folder
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Recurse -Filter package.json -File |
                 Where-Object { $_.FullName -notmatch 'node_modules' } |
                 Select-Object -First 1
          if (-not $pkg) {
            Write-Error "package.json was not found. Upload the CONTENTS of the digicre8-office folder to the repository."
            exit 1
          }
          Write-Host "Project folder: $($pkg.DirectoryName)"
          "PROJECT_DIR=$($pkg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $pkg.DirectoryName | Format-Table Name

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run dist

      - name: List output
        working-directory: ${{ env.PROJECT_DIR }}
        run: Get-ChildItem dist
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: DigiCre8-Office-installer
          path: ${{ env.PROJECT_DIR }}/dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/dist/*.exe
