<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigiCre8 Office</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="tabbar">
    <div class="brand" aria-label="DigiCre8 Office"><span class="brand-mark">D8</span></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="icon-btn" id="newTab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
    <button class="icon-btn wide" id="themeBtn" title="Switch theme" aria-label="Switch theme"></button>
  </header>
  <main id="view"></main>
  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlgTitle"></h3>
      <div id="dlgBody"></div>
      <div class="dialog-actions">
        <button value="ok" class="btn primary" id="dlgOk">OK</button>
        <button value="cancel" class="btn" id="dlgCancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <input type="file" id="picInput" accept="image/*" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="renderer.js"></script>
  <script src="writer-plus.js"></script>
</body>
</html>
